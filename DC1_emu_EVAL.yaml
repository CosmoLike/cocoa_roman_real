params:
  As_1e9:
    prior:
      min: 1.1
      max: 2.8
    ref:
      dist: norm
      loc: 2.1
      scale: 0.2
    proposal: 0.2
    latex: 10^9 A_\mathrm{s})
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 60
      max: 76
    ref:
      dist: norm
      loc: 67.32
      scale: 3
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.04
      max: 0.055
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
  omegam:
    prior:
      min: 0.1
      max: 0.6
    ref:
      dist: norm
      loc: 0.316
      scale: 0.015
    proposal: 0.015
    latex: \Omega_\mathrm{m}
  w0pwa:
    prior:
      min: -5 
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
  w:
    prior:
      min: -3
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  mnu:
    value: 0.06
    drop: True
  #tau:
  #  value: 0.0697186
  #  latex: \tau_\mathrm{reio}
  # ---------------------------------------------------------------------------------------
  # ------------------------------------- DERIVED PARAMETERS ------------------------------
  # ---------------------------------------------------------------------------------------
  # WARNING: DO NOT REMOVE omegabh2/omegach2/omegamh2/wa/As/ FROM DERIVED PARAMETERS
  # SEE: github.com/CosmoLike/cocoa#warning-warning-warning-weak-lensing-yaml-files-in-cobaya-
  # --------------------------------------------------------------------------------------- 
  As:
    derived: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  wa:
    derived: 'lambda w0pwa, w: w0pwa - w'
    latex: w_{a,\mathrm{DE}}
  omegabh2:
    derived: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    derived: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  #omegal:
  #  latex: \Omega_\Lambda
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  #sigma8:
  #  latex: \sigma_8
  #s8h5:
  #  derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
  #  latex: \sigma_8/h^{0.5}
  #s8omegamp5:
  #  derived: 'lambda sigma8, omegam: sigma8*omegam**0.5'
  #  latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  #s8omegamp25:
  #  derived: 'lambda sigma8, omegam: sigma8*omegam**0.25'
  #  latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  #age:
  #  latex: '{\rm{Age}}/\mathrm{Gyr}'
  #rdrag:
  #  latex: r_\mathrm{drag}
  #yheused:
  #  latex: Y_P^\mathrm{BBN}
  #omegan2:
  #  latex: \Omega_\mathrm{\\nu} h^2
  #omegan:
  #  derived: 'lambda omegan2, H0: omegan2/((H0/100)**2)'
  #  latex: \Omega_\mathrm{\\nu}


  ### NUISSANCE PARAMETERS
  # WL photo-z errors (lens=source -> same errors for both)
