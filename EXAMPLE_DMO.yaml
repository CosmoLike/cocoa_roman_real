timing: False
debug: False
stop_at_error: False
output: ./projects/roman_real/chains/EXAMPLE_DMO

likelihood:
  roman_real.cosmic_shear:
    path: ./external_modules/data/roman_real
    data_file: example1.dataset
    lmax: 70000
    accuracyboost: 1.0
    integration_accuracy: 0
    kmax_boltzmann: 7.5
    non_linear_emul: 2
    baryon_suppression: 0 # This turns off baryon suppression
    IA_model: 0
    IA_redshift_evolution: 3
    ggl_exclude: [[6,0],[7,0],[7,1]]
    create_baryon_pca: false
    print_datavector: true
    print_datavector_file: "./projects/roman_real/DMO.modelvector"
    
params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.65
    latex: 10^9 A_s
    drop: true
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.01
    latex: n_s
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 5
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.004
    latex: Omega_b
    drop: true
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.316
      scale: 0.02
    latex: Omega_m
    drop: true
  mnu:
    prior:
      min: 0.06
      max: 0.6
    ref:
      dist: norm
      loc: 0.06
      scale: 0.02
    latex: m_nu
  w:
    value: -1
  alpha_spk:
    prior:
      min: 3.8
      max: 4.6
    ref:
      dist: norm
      loc: 4.189
      scale: 0.12
    proposal: 0.12
    latex: alpha_SPk
  beta_spk:
    prior:
      min: 1.0
      max: 1.6
    ref:
      dist: norm
      loc: 1.273
      scale: 0.08
    proposal: 0.08
    latex: beta_SPk
  gamma_spk:
    prior:
      min: 0.1
      max: 0.75
    ref:
      dist: norm
      loc: 0.298
      scale: 0.10
    proposal: 0.10
    latex: gamma_SPk
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  

theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.05
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 10
      kmax: 10
  baryon_suppression:
    python_path: ./projects/roman_real
    class: pyspk_theory.BaryonSuppression
    baryon_model: 1

sampler:
  evaluate:
    N: 1
    override:
      As_1e9: 2.1
      ns: 0.96605
      H0: 67.32
      omegab: 0.0495
      omegam: 0.316
      mnu: 0.06
      alpha_spk: 4.189
      beta_spk: 1.273
      gamma_spk: 0.298
      roman_DZ_S1: 0.0
      roman_DZ_S2: 0.0
      roman_DZ_S3: 0.0
      roman_DZ_S4: 0.0
      roman_DZ_S5: 0.0
      roman_DZ_S6: 0.0
      roman_DZ_S7: 0.0
      roman_DZ_S8: 0.0
      roman_M1: 0.0
      roman_M2: 0.0
      roman_M3: 0.0
      roman_M4: 0.0
      roman_M5: 0.0
      roman_M6: 0.0
      roman_M7: 0.0
      roman_M8: 0.0
      roman_A1_1: 0.6
      roman_A1_2: -1.5
