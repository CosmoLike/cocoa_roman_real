timing: True
debug: False
stop_at_error: False

likelihood:
  ROMAN_real_emu_emu.ROMAN_real_emu_emu_3x2pt: #name of likelihood depends on your project name
    path: ./external_modules/data/ROMAN_real_emu_emu #replace ROMAN_real_emu_emu with the name of your directory if different
    data_file: dc1_alternate.dataset 
    accuracyboost: 1.0
    integration_accuracy: 0
    kmax_boltzmann: 5.0
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0 #NLA
    IA_redshift_evolution: 3
    print_datavector: False
    ggl_exclude: [[6,0],[7,0],[7,1]] 

## SET PRIORS ON COSMOLOGICAL PARAMETERS
params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      
      scale: 0.65
    proposal: 0.4
    latex: 10^9 A_\mathrm{s})
    drop: true
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
